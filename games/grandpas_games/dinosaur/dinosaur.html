<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🦖 Dino's Letter Lunch</title>

  <link rel="stylesheet" href="dinosaur.css">

</head>

<body>

<main class="game">

  <!-- TITLE -->

  <h1>
    🦖 Dino's Letter Lunch 🍔
  </h1>


  <!-- FULL SCREEN JUNGLE -->

  <section
    id="gameArea"
    aria-label="Dinosaur Letter Game"
  >

    <!-- JUNGLE -->

    <div id="jungleDecor">
      🌴 🌿 🌴 🌿 🌴
    </div>


    <!-- TARGET LETTER ABOVE DINO -->

    <div id="dinoTarget">

      <div class="target-glow">

        <span id="targetLetter">A</span>

      </div>

      <div class="target-arrow">
        👇
      </div>

    </div>


    <!-- DINOSAUR -->

    <div id="dinosaur">

      <div id="dinoSpeech">
        🍔?
      </div>

      <div id="dinoBody">
        🦖
      </div>

    </div>


    <!-- HAMBURGERS -->

    <div id="foodArea"></div>


    <!-- EFFECTS -->

    <div id="effect"></div>

    <div id="messageEffect"></div>


  </section>


  <!-- SCORE -->

  <section class="game-info">

    <div>
      ⭐ <span id="score">0</span>
    </div>

    <div>
      🍔 <span id="fed">0</span>
    </div>

  </section>


  <!-- KEYBOARD -->

  <section class="keyboard">

    <div id="keyboardLetters"></div>

  </section>


  <!-- RESTART -->

  <button
    id="restartButton"
    type="button"
  >
    🔄 Play Again
  </button>


</main>


<script src="dinosaur.js"></script>

</body>

</html>
