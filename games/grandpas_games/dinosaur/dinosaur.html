<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🦖 Dino's Letter Lunch</title>

  <link
    rel="stylesheet"
    href="dinosaur.css"
  >

</head>


<body>

<main class="game">

  <h1>
    🦖 Dino's Letter Lunch 🍔
  </h1>


  <section id="gameArea">


    <!-- JUNGLE -->

    <div id="jungleDecor">
      🌴 🌿 🌴 🌿 🌴 🌿 🌴
    </div>


    <!-- TARGET LETTER -->

    <div id="dinoTarget">

      <div id="targetLetter">
        A
      </div>

      <div class="targetArrow">
        ▼
      </div>

    </div>


    <!-- DINOSAUR -->

    <div id="dinosaur">

      <div id="dinoSpeech">
        🍔?
      </div>

      <div id="dinoBody">
        🦖
      </div>

    </div>


    <!-- BURGERS -->

    <div id="foodArea"></div>


    <!-- EFFECT -->

    <div id="effect"></div>

    <div id="messageEffect"></div>


  </section>


  <!-- SCORE -->

  <div class="game-info">

    ⭐ <span id="score">0</span>

    &nbsp;&nbsp;

    🍔 <span id="fed">0</span>

  </div>


  <!-- KEYBOARD -->

  <div class="keyboard">

    <div id="keyboardLetters"></div>

  </div>


  <button
    id="restartButton"
    type="button"
  >
    🔄 Play Again
  </button>


</main>


<script src="dinosaur.js"></script>

</body>

</html>
