<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🦖 Dino's Letter Lunch</title>

  <link rel="stylesheet" href="dinosaur.css">
</head>

<body>

  <main class="game">

    <h1>🦖 Dino's Letter Lunch 🍔</h1>

    <section class="mission">

      <h2>🌴 Feed the Dinosaur!</h2>

      <p id="message">
        Find the letter Dino wants!
      </p>

      <div class="target">

        <span>🦖 Dino wants:</span>

        <strong id="targetLetter">A</strong>

      </div>

    </section>


    <!-- GAME -->

    <section
      id="gameArea"
      aria-label="Dinosaur letter game"
    >

      <div id="jungleDecor">
        🌴 🌿 🌴 🌿 🌴
      </div>


      <!-- DINOSAUR -->

      <div id="dinosaur">

        <div id="dinoSpeech">
          🍔?
        </div>

        <div id="dinoBody">
          🦖
        </div>

      </div>


      <!-- HAMBURGERS APPEAR HERE -->

      <div id="foodArea"></div>


      <!-- EFFECT -->

      <div id="effect"></div>

    </section>


    <!-- SCORE -->

    <section class="game-info">

      <div>
        ⭐ Stars:
        <span id="score">0</span>
      </div>

      <div>
        🍔 Fed:
        <span id="fed">0</span>
      </div>

    </section>


    <!-- KEYBOARD -->

    <section class="keyboard">

      <p>⌨️ You can also press a letter!</p>

      <div id="keyboardLetters"></div>

    </section>


    <!-- RESTART -->

    <button
      id="restartButton"
      type="button"
    >
      🔄 Play Again
    </button>


    <a
      href="../grandpas_games.html"
      class="backButton"
    >
      ❤️ Back to Grandpa's Adventures
    </a>

  </main>


  <script src="dinosaur.js"></script>

</body>

</html>
