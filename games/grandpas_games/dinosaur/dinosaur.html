<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🦖 Dino's Letter Lunch</title>

  <link rel="stylesheet" href="dinosaur.css">
</head>

<body>

  <main class="game">

    <!-- TITLE ONLY -->
    <header class="title-area">
      <h1>🦖 Dino's Letter Lunch 🍔</h1>
    </header>


    <!-- FULL SCREEN GAME -->

    <section
      id="gameArea"
      aria-label="Dinosaur letter learning game"
    >

      <!-- JUNGLE BACKGROUND -->

      <div class="jungle-back">
        🌴
        <span>🌿</span>
        🌴
        <span>🌿</span>
        🌴
      </div>


      <!-- TARGET LETTER ABOVE DINO -->

      <div id="targetBubble">

        <div class="target-label">
          FIND
        </div>

        <div id="targetLetter">
          A
        </div>

      </div>


      <!-- DINOSAUR -->

      <div id="dinosaur">

        <div id="dinoSpeech">
          🍔?
        </div>

        <div id="dinoEmoji">
          🦖
        </div>

      </div>


      <!-- BURGERS WITH LETTERS -->

      <div id="foodArea"></div>


      <!-- GAME EFFECTS -->

      <div id="effect"></div>


      <!-- MESSAGE -->

      <div id="gameMessage">
        Pick the letter Dino wants!
      </div>


      <!-- GROUND -->

      <div class="jungle-ground">
        🌿 🌱 🌿 🌱 🌿 🌱 🌿 🌱 🌿
      </div>

    </section>


    <!-- GAME INFORMATION -->

    <section class="game-info">

      <div class="info-box">
        ⭐
        <span>Stars</span>
        <strong id="score">0</strong>
      </div>

      <div class="info-box">
        🍔
        <span>Fed</span>
        <strong id="fed">0</strong>
      </div>

    </section>


    <!-- KEYBOARD -->

    <section class="keyboard">

      <p>
        🖱️ Click a burger or press a letter!
      </p>

      <div id="keyboardLetters"></div>

    </section>


    <!-- PLAY AGAIN -->

    <button
      id="restartButton"
      type="button"
    >
      🔄 PLAY AGAIN
    </button>


    <!-- BACK -->

    <a
      href="../grandpas_games.html"
      class="backButton"
    >
      ❤️ Back to Grandpa's Adventures
    </a>

  </main>


  <!-- GAME JAVASCRIPT -->

  <script src="dinosaur.js"></script>

</body>

</html>
