<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🦖 Dino's Letter Lunch</title>

  <link rel="stylesheet" href="dinosaur.css">
</head>

<body>

  <main class="game">

    <h1>
      🦖 Dino's Letter Lunch 🍔
    </h1>


    <!-- FIND LETTER -->

    <section class="find-area">

      <div class="find-label">
        🔎 FIND
      </div>

      <div id="targetLetter">
        A
      </div>

    </section>


    <!-- MESSAGE -->

    <div id="message">
      Help Dino spell the word!
    </div>


    <!-- GAME -->

    <section
      id="gameArea"
      aria-label="Dinosaur letter game"
    >

      <!-- DINOSAUR -->

      <div id="dinosaur">

        <div id="dinoSpeech">
          🍔?
        </div>

        <div id="dinoBody">
          🦖
        </div>

      </div>


      <!-- BURGERS -->

      <div id="foodArea"></div>


      <!-- EXPLOSION -->

      <div id="effect"></div>

    </section>


    <!-- GAME INFORMATION -->

    <section class="game-info">

      <div>
        ⭐ Score:
        <span id="score">0</span>
      </div>

      <div>
        🍔 Fed:
        <span id="fed">0</span>
      </div>

      <div>
        📝 Word:
        <span id="wordProgress">_ _ _</span>
      </div>

    </section>


    <!-- KEYBOARD -->

    <section class="keyboard">

      <p>
        ⌨️ Or tap a letter
      </p>

      <div id="keyboardLetters"></div>

    </section>


    <!-- PLAY AGAIN -->

    <button
      id="restartButton"
      type="button"
    >
      🔄 PLAY AGAIN
    </button>


    <!-- BACK -->

    <a
      href="../grandpas_games.html"
      class="backButton"
    >
      ❤️ Back to Grandpa's Adventures
    </a>

  </main>


  <script src="dinosaur.js"></script>

</body>

</html>
