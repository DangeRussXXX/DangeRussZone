<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Grandpa's Adventure</title>

  <link
    rel="stylesheet"
    href="grandpas.css"
  >

</head>


<body>

  <main class="game-hub">

    <h1>🌟 Grandpa's Adventure 🌟</h1>

    <p class="welcome">
      A special adventure made just for you!
    </p>

    <h2>Choose Your Adventure</h2>


    <div class="adventure-grid">


      <!-- SPACE MISSION -->

      <button
        class="adventure-card space"
        data-game="space"
      >

        <span class="emoji">🚀</span>

        <span class="title">
          Grandson Space Mission
        </span>

        <span class="description">
          Fly through space, collect stars
          and avoid asteroids!
        </span>

      </button>


      <!-- TREASURE HUNT -->

      <button
        class="adventure-card treasure"
        data-game="treasure"
      >

        <span class="emoji">🪙</span>

        <span class="title">
          Treasure Hunt
        </span>

        <span class="description">
          Find hidden treasure and discover
          secret places!
        </span>

      </button>


      <!-- DRAGON QUEST -->

      <button
        class="adventure-card dragon"
        data-game="dragon"
      >

        <span class="emoji">🐉</span>

        <span class="title">
          Dragon Quest
        </span>

        <span class="description">
          Rescue your friend from the
          dragon's castle!
        </span>

      </button>


      <!-- GRAND PRIX -->

      <button
        class="adventure-card racing"
        data-game="racing"
      >

        <span class="emoji">🏎️</span>

        <span class="title">
          Grandpa's Grand Prix
        </span>

        <span class="description">
          Race around the track and
          beat your best time!
        </span>

      </button>


    </div>


    <p
      id="message"
      class="message"
    ></p>


    <!-- BACK TO GAMES -->

    <a
      href="../games.html"
      class="back-button"
    >
      🎮 Back to Games
    </a>

  </main>


  <script src="grandpas.js"></script>

</body>

</html>
